name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # No DATABASE_URL: content falls back to static data, so the build
          # exercises every page without needing a live database.
          NEXT_PUBLIC_SITE_URL: https://example.org
